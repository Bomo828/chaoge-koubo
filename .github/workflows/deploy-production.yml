name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: merchant-studio-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy to Tencent Cloud
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Install dependencies
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Validate project
        run: |
          set -euo pipefail
          pnpm run typecheck
          pnpm run lint
          pnpm --dir services/remotion-worker install --frozen-lockfile
          pnpm --dir services/remotion-worker typecheck
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/video-worker-pycache" python3 -m py_compile \
            services/video-worker/main.py \
            services/video-worker/caption_router.py \
            services/video-worker/music_router.py \
            services/video-worker/sfx_router.py

      - name: Build production bundle
        run: |
          set -euo pipefail
          pnpm exec next build --webpack

      - name: Prepare release directory
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/merchant-studio-release"

          mkdir -p "$release_dir/.next"
          cp -R .next/standalone/. "$release_dir/"
          cp -R .next/static "$release_dir/.next/static"
          cp -R public "$release_dir/public"
          cp -R deploy "$release_dir/deploy"
          printf '%s\n' "$RELEASE_SHA" > "$release_dir/RELEASE_SHA"

      - name: Configure deployment SSH
        env:
          DEPLOY_PRIVATE_KEY: ${{ secrets.TENCENT_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.TENCENT_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > "$HOME/.ssh/tencent_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/tencent_deploy" "$HOME/.ssh/known_hosts"

      - name: Upload and activate release
        env:
          DEPLOY_HOST: ${{ secrets.TENCENT_SSH_HOST }}
          DEPLOY_PORT: ${{ secrets.TENCENT_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.TENCENT_SSH_USER }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          release_dir="$RUNNER_TEMP/merchant-studio-release"
          remote_archive="/tmp/merchant-studio-web-${RELEASE_SHA}.tar.gz"
          ssh_options=(-i "$HOME/.ssh/tencent_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)

          rsync --archive --compress --checksum --delete \
            --exclude '.data' --exclude '.env.local' \
            -e "ssh -i $HOME/.ssh/tencent_deploy -p $port -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            "$release_dir/" "${DEPLOY_USER}@${DEPLOY_HOST}:/home/merchantdeploy/release-cache/"
          ssh "${ssh_options[@]}" -p "$port" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "tar -czf '${remote_archive}' -C '/home/merchantdeploy/release-cache' . && sudo /usr/local/sbin/deploy-merchant-studio '${remote_archive}' '${RELEASE_SHA}'"

      - name: Deploy video worker when changed
        env:
          DEPLOY_HOST: ${{ secrets.TENCENT_SSH_HOST }}
          DEPLOY_PORT: ${{ secrets.TENCENT_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.TENCENT_SSH_USER }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "workflow_dispatch" ]] && git diff --quiet HEAD^ HEAD -- services/video-worker services/remotion-worker; then
            echo "No video worker changes in this release."
            exit 0
          fi
          port="${DEPLOY_PORT:-22}"
          ssh_options=(-i "$HOME/.ssh/tencent_deploy" -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          package_dir="$RUNNER_TEMP/video-worker-release"
          archive="$RUNNER_TEMP/merchant-video-worker-${RELEASE_SHA}.tar.gz"
          remote_archive="/tmp/merchant-video-worker-${RELEASE_SHA}.tar.gz"
          mkdir -p "$package_dir"
          cp -R services/video-worker/. "$package_dir/"
          # The installed server deploy command activates one atomic worker
          # directory. Bundle Remotion beside main.py and let main.py prefer
          # this nested, release-matched renderer over a legacy sibling copy.
          mkdir -p "$package_dir/remotion-worker"
          rsync --archive --exclude node_modules services/remotion-worker/ "$package_dir/remotion-worker/"
          (
            cd "$package_dir/remotion-worker"
            pnpm install --prod --frozen-lockfile --config.node-linker=hoisted
          )
          printf '%s\n' "$RELEASE_SHA" > "$package_dir/RELEASE_SHA"
          tar -czf "$archive" -C "$package_dir" .
          scp -i "$HOME/.ssh/tencent_deploy" -P "$port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$archive" "${DEPLOY_USER}@${DEPLOY_HOST}:${remote_archive}"
          if ! ssh "${ssh_options[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "sudo -n -l /usr/local/sbin/deploy-video-worker >/dev/null 2>&1"; then
            echo "Video worker archive is staged at ${remote_archive}."
            echo "Run deploy/bootstrap-video-worker-deploy.sh once on the server, then activate the staged archive."
            exit 0
          fi
          ssh "${ssh_options[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "sudo /usr/local/sbin/deploy-video-worker '${remote_archive}' '${RELEASE_SHA}'"

      - name: Verify public health endpoint
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 15 https://studio.chaogeai.top/api/health; then
              exit 0
            fi
            sleep 5
          done
          exit 1
