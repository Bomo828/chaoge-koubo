name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: merchant-studio-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy to Tencent Cloud
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Validate project
        run: |
          set -euo pipefail
          pnpm run typecheck
          pnpm run lint
          pnpm --dir services/remotion-worker install --frozen-lockfile
          pnpm --dir services/remotion-worker typecheck
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/video-worker-pycache" python3 -m py_compile \
            services/video-worker/main.py \
            services/video-worker/caption_router.py \
            services/video-worker/music_router.py \
            services/video-worker/sfx_router.py

      - name: Build production bundle
        run: |
          set -euo pipefail
          pnpm exec next build --webpack

      - name: Prepare release directory
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/merchant-studio-release"

          mkdir -p "$release_dir/.next"
          cp -R .next/standalone/. "$release_dir/"
          cp -R .next/static "$release_dir/.next/static"
          cp -R public "$release_dir/public"
          cp -R deploy "$release_dir/deploy"
          printf '%s\n' "$RELEASE_SHA" > "$release_dir/RELEASE_SHA"

      - name: Configure deployment SSH
        env:
          DEPLOY_PRIVATE_KEY: ${{ secrets.TENCENT_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.TENCENT_SSH_KNOWN_HOSTS }}
          VIDEO_WORKER_KNOWN_HOSTS: ${{ secrets.VIDEO_WORKER_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_PRIVATE_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          test -n "$VIDEO_WORKER_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > "$HOME/.ssh/tencent_deploy"
          printf '%s\n%s\n' "$DEPLOY_KNOWN_HOSTS" "$VIDEO_WORKER_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/tencent_deploy" "$HOME/.ssh/known_hosts"

      - name: Upload and activate release
        env:
          DEPLOY_HOST: ${{ secrets.TENCENT_SSH_HOST }}
          DEPLOY_PORT: ${{ secrets.TENCENT_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.TENCENT_SSH_USER }}
          VIDEO_WORKER_UPSTREAM_URL: ${{ vars.VIDEO_WORKER_UPSTREAM_URL }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$VIDEO_WORKER_UPSTREAM_URL"
          port="${DEPLOY_PORT:-22}"
          release_dir="$RUNNER_TEMP/merchant-studio-release"
          remote_archive="/tmp/merchant-studio-web-${RELEASE_SHA}.tar.gz"
          ssh_options=(-i "$HOME/.ssh/tencent_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          printf 'VIDEO_WORKER_UPSTREAM_URL=%s\n' "$VIDEO_WORKER_UPSTREAM_URL" \
            > "$release_dir/.video-worker-upstream"

          rsync --archive --compress --checksum --delete \
            --exclude '.data' --exclude '.env.local' \
            -e "ssh -i $HOME/.ssh/tencent_deploy -p $port -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            "$release_dir/" "${DEPLOY_USER}@${DEPLOY_HOST}:/home/merchantdeploy/release-cache/"
          ssh "${ssh_options[@]}" -p "$port" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "tar -czf '${remote_archive}' -C '/home/merchantdeploy/release-cache' . && sudo /usr/local/sbin/deploy-merchant-studio '${remote_archive}' '${RELEASE_SHA}'"

      - name: Deploy video worker when changed
        env:
          DEPLOY_HOST: ${{ vars.VIDEO_WORKER_SSH_HOST }}
          DEPLOY_PORT: ${{ vars.VIDEO_WORKER_SSH_PORT }}
          DEPLOY_USER: ${{ vars.VIDEO_WORKER_SSH_USER }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          if [[ "${{ github.event_name }}" != "workflow_dispatch" ]] && git diff --quiet HEAD^ HEAD -- services/video-worker services/remotion-worker .github/workflows/deploy-production.yml deploy/deploy-video-worker; then
            echo "No video worker changes in this release."
            exit 0
          fi
          port="${DEPLOY_PORT:-22}"
          ssh_options=(-i "$HOME/.ssh/tencent_deploy" -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          package_dir="$RUNNER_TEMP/video-worker-release"
          remote_cache="/home/merchantdeploy/video-worker-release-cache"
          remote_archive="/tmp/merchant-video-worker-${RELEASE_SHA}.tar.gz"
          mkdir -p "$package_dir"
          cp -R services/video-worker/. "$package_dir/"
          # The server keeps its virtualenv between releases. Bundle the small,
          # read-only Douyin adapter and its HTTP dependency with this release
          # so the feature is available immediately after an atomic deploy.
          python3 -m pip install --disable-pip-version-check --no-deps \
            --target "$package_dir/vendor" \
            'https://github.com/JNHFlow21/social-media-toolkit/archive/139525c35ae55f090003fdb243e78ca22c1f402a.tar.gz'
          python3 -m pip install --disable-pip-version-check \
            --target "$package_dir/vendor" 'requests>=2.33.0,<3'
          printf '%s\n' '"""Bundled public Douyin adapter (Apache-2.0)."""' \
            > "$package_dir/vendor/social_media_toolkit/__init__.py"
          printf '%s\n' '"""Bundled platform adapters."""' \
            > "$package_dir/vendor/social_media_toolkit/platforms/__init__.py"
          # The installed server deploy command activates one atomic worker
          # directory. Bundle the renderer source beside main.py, but reuse the
          # already installed production dependencies on the server. Shipping
          # node_modules over SCP took close to an hour on the Tencent route and
          # caused otherwise tiny worker fixes to be cancelled before activation.
          mkdir -p "$package_dir/remotion-worker"
          rsync --archive --exclude node_modules services/remotion-worker/ "$package_dir/remotion-worker/"
          printf '%s\n' "$RELEASE_SHA" > "$package_dir/RELEASE_SHA"
          # Seed a persistent source cache from the active worker once.  The
          # following rsync then sends only files that actually changed, which
          # keeps template assets and licensed audio out of repeat transfers.
          ssh "${ssh_options[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "mkdir -p '${remote_cache}' && if [ ! -f '${remote_cache}/requirements.txt' ]; then rsync --archive --exclude '.env' --exclude '.venv' --exclude 'data' --exclude 'remotion-worker/node_modules' /opt/merchant-studio/video-worker/ '${remote_cache}/'; fi"
          rsync --archive --compress --checksum --delete \
            --exclude '.env' --exclude '.venv' --exclude 'data' --exclude 'remotion-worker/node_modules' \
            -e "ssh -i $HOME/.ssh/tencent_deploy -p $port -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            "$package_dir/" "${DEPLOY_USER}@${DEPLOY_HOST}:${remote_cache}/"
          ssh "${ssh_options[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "RELEASE_SHA='${RELEASE_SHA}' bash -s" <<'REMOTE'
          set -euo pipefail
          final_archive="/tmp/merchant-video-worker-${RELEASE_SHA}.tar.gz"
          scratch="/home/merchantdeploy/release-cache/video-worker-${RELEASE_SHA}"
          source_cache="/home/merchantdeploy/video-worker-release-cache"
          current_worker="/opt/merchant-studio/video-worker"
          cleanup() {
            rm -rf -- "$scratch"
          }
          trap cleanup EXIT
          rm -rf -- "$scratch"
          mkdir -p "$scratch"
          cp -a "$source_cache"/. "$scratch"/
          test -d "$current_worker/remotion-worker/node_modules"
          test -f "$current_worker/remotion-worker/pnpm-lock.yaml"
          test "$(sha256sum "$scratch/remotion-worker/pnpm-lock.yaml" | awk '{print $1}')" = \
            "$(sha256sum "$current_worker/remotion-worker/pnpm-lock.yaml" | awk '{print $1}')"
          if ! cp -al "$current_worker/remotion-worker/node_modules" "$scratch/remotion-worker/node_modules"; then
            rm -rf -- "$scratch/remotion-worker/node_modules"
            cp -a "$current_worker/remotion-worker/node_modules" "$scratch/remotion-worker/node_modules"
          fi
          rm -f -- "$final_archive"
          tar -czf "$final_archive" -C "$scratch" .
          REMOTE
          if ! ssh "${ssh_options[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "sudo -n -l /usr/local/sbin/deploy-video-worker >/dev/null 2>&1"; then
            echo "Video worker archive is staged at ${remote_archive}."
            echo "Run deploy/bootstrap-video-worker-deploy.sh once on the server, then activate the staged archive."
            exit 0
          fi
          ssh "${ssh_options[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "sudo /usr/local/sbin/deploy-video-worker '${remote_archive}' '${RELEASE_SHA}'"

      - name: Verify public health endpoint
        env:
          PUBLIC_HEALTHCHECK_URL: ${{ vars.PUBLIC_HEALTHCHECK_URL }}
          PUBLIC_VIDEO_WORKER_HEALTHCHECK_URL: ${{ vars.PUBLIC_VIDEO_WORKER_HEALTHCHECK_URL }}
        run: |
          set -euo pipefail
          test -n "$PUBLIC_HEALTHCHECK_URL"
          test -n "$PUBLIC_VIDEO_WORKER_HEALTHCHECK_URL"
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 15 "$PUBLIC_HEALTHCHECK_URL"; then
              break
            fi
            if [[ "$attempt" == "12" ]]; then
              exit 1
            fi
            sleep 5
          done
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 15 "$PUBLIC_VIDEO_WORKER_HEALTHCHECK_URL"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
