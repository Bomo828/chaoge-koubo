server {
    listen 80;
    server_name 129.204.151.78;

    client_max_body_size 500m;

    location /video-worker/ {
        proxy_pass http://127.0.0.1:8790/;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
